# ESPHome Konfiguration: Autarker Solarstrahlungs-Sensor
# Komplett solarbetrieben - kein Netzanschluss noetig!
#
# Zweck: Sonneneinstrahlung messen, PV-Ertrag der Dachanlage abschaetzen,
#         EV-Ladung waehrend Sonnenstunden optimieren.
#
# Hardware:
#   - ESP32 DevKit (z.B. ESP32-WROOM-32)
#   - BH1750 Lux-Sensor (I2C, Adresse 0x23)
#   - Mini-Solarpanel 5V/6V (1-2W genuegt)
#   - TP4056 Lademodul mit Schutzschaltung
#   - 18650 Li-Ion Akku (oder LiPo 3.7V)
#
# Stromversorgung:
#   Solarpanel 5-6V --> TP4056 IN+/IN-
#   TP4056 OUT+      --> ESP32 VIN (oder 5V)
#   TP4056 OUT-      --> ESP32 GND
#   18650 Akku       --> TP4056 BAT+/BAT-
#
# Verkabelung Sensor (I2C):
#   ESP32 GPIO21 (SDA) -> BH1750 SDA
#   ESP32 GPIO22 (SCL) -> BH1750 SCL
#   ESP32 3.3V          -> BH1750 VCC
#   ESP32 GND           -> BH1750 GND
#
# Batteriespannung messen (optional aber empfohlen):
#   ESP32 GPIO35 -> Spannungsteiler Mitte (2x 100kOhm zwischen BAT+ und GND)
#
# Montage:
#   - Ueberall draussen montieren wo Sonne hinkommt
#   - Solarpanel und BH1750 gleiche Richtung wie Dach-PV-Module
#   - IP65 Gehaeuse, Sensor-Fenster nach oben
#   - WiFi-Reichweite zum Haus beachten

esphome:
  name: solar-radiation-sensor
  friendly_name: "Solarstrahlungs-Sensor"

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Schnellere Verbindung nach Deep-Sleep
  fast_connect: true
  ap:
    ssid: "Solar-Sensor-Fallback"
    password: !secret fallback_password

captive_portal:

logger:
  # Im Batteriebetrieb weniger loggen
  level: WARN

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ============================================================
# Deep-Sleep: Strom sparen im Batteriebetrieb
# ============================================================
# Der ESP32 wacht alle 2 Minuten auf, misst, sendet, schlaeft wieder.
# Stromverbrauch: ~150mA aktiv vs. ~10uA im Deep-Sleep
# -> Ein 18650 Akku (3000mAh) haelt damit mehrere Tage auch ohne Sonne.
#
# WICHTIG: Zum Flashen/Updaten muss Deep-Sleep temporaer deaktiviert werden.
# Dazu den "OTA Modus" Schalter in Home Assistant einschalten.
deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 2min

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  # BH1750 Lux-Sensor
  - platform: bh1750
    name: "Sonneneinstrahlung Lux"
    address: 0x23
    update_interval: 5s
    id: solar_lux
    unit_of_measurement: "lx"
    accuracy_decimals: 0

  # Umrechnung Lux -> W/m² (Naeherung fuer Sonnenlicht)
  # 1 W/m² entspricht ca. 120 Lux bei Sonnenlicht-Spektrum
  - platform: template
    name: "Sonneneinstrahlung"
    id: solar_irradiance_wm2
    unit_of_measurement: "W/m²"
    accuracy_decimals: 1
    icon: "mdi:white-balance-sunny"
    lambda: |-
      float lux = id(solar_lux).state;
      if (isnan(lux)) return NAN;
      return lux / 120.0;
    update_interval: 5s

  # ============================================================
  # Batterie-Ueberwachung
  # ============================================================
  # Spannungsteiler: 2x 100kOhm zwischen BAT+ und GND
  # Mitte an GPIO35 (ADC, nur Input)
  # Gemessene Spannung = halbe Batteriespannung
  - platform: adc
    pin: GPIO35
    name: "Batteriespannung"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 5s
    attenuation: 11db
    filters:
      - multiply: 2.0  # Spannungsteiler kompensieren

  - platform: template
    name: "Batteriestand"
    id: battery_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return NAN;
      // Li-Ion: 4.2V = voll, 3.0V = leer
      float pct = (v - 3.0) / (4.2 - 3.0) * 100.0;
      if (pct > 100.0) return 100.0;
      if (pct < 0.0) return 0.0;
      return pct;
    update_interval: 5s

  # ============================================================
  # Geschaetzte PV-Leistung der Dachanlage
  # ============================================================
  # WICHTIG: Passe diese Werte an deine Anlage an!
  #
  # Wenn du die Anlagengroesse nicht genau kennst:
  #   - Typisches Einfamilienhaus Schweiz: 8-15 kWp
  #   - 1 kWp = ca. 5 m² Modulflaeche
  #   - Zaehle die Module auf dem Dach: 1 Modul = 0.3-0.4 kWp
  - platform: template
    name: "Geschaetzte PV-Leistung"
    id: estimated_pv_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    icon: "mdi:solar-power"
    lambda: |-
      float irradiance = id(solar_irradiance_wm2).state;
      if (isnan(irradiance)) return NAN;

      // =============================================
      // ANPASSEN AN DEINE DACHANLAGE:
      // =============================================
      float peak_power_wp = 10000.0;  // Nennleistung in Wp (10 kWp = 10000)
      float system_losses = 0.80;     // Verluste (Wechselrichter, Kabel, Temp.)

      // STC = 1000 W/m², daher: Leistung = Einstrahlung/1000 * Nennleistung
      float power = (irradiance / 1000.0) * peak_power_wp * system_losses;
      return power;
    update_interval: 5s

  # ============================================================
  # EV-Laden: Verfuegbare Leistung fuer Wallbox
  # ============================================================
  - platform: template
    name: "Verfuegbar fuer EV-Ladung"
    id: available_ev_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    icon: "mdi:ev-station"
    lambda: |-
      float pv_power = id(estimated_pv_power).state;
      if (isnan(pv_power)) return 0.0;

      // Grundlast Haushalt abziehen (Kuehlschrank, Standby, etc.)
      float household_base_load = 400.0;

      float available = pv_power - household_base_load;
      if (available < 0) return 0.0;
      return available;
    update_interval: 5s

  # Wie viele Ampere kann die Wallbox ziehen?
  - platform: template
    name: "EV Lade-Ampere moeglich"
    id: ev_charge_amps
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: "mdi:current-ac"
    lambda: |-
      float available = id(available_ev_power).state;
      if (isnan(available) || available < 1380) return 0.0;

      // ANPASSEN: Fuer 3-phasig aendern zu: available / 690.0
      float amps = available / 230.0;  // 1-phasig

      if (amps < 6.0) return 0.0;
      if (amps > 16.0) return 16.0;
      return amps;
    update_interval: 5s

  # WiFi Signalstaerke
  - platform: wifi_signal
    name: "Sensor WiFi Signal"
    update_interval: 5s

binary_sensor:
  # Kann das Auto jetzt geladen werden?
  - platform: template
    name: "EV Laden moeglich"
    id: ev_charging_possible
    icon: "mdi:car-electric"
    lambda: |-
      float amps = id(ev_charge_amps).state;
      return !isnan(amps) && amps >= 6.0;

  # Scheint die Sonne gerade?
  - platform: template
    name: "Sonne aktiv"
    id: sun_active
    icon: "mdi:weather-sunny"
    lambda: |-
      float irradiance = id(solar_irradiance_wm2).state;
      if (isnan(irradiance)) return false;
      return irradiance > 50.0;

switch:
  # OTA-Modus: Deep-Sleep deaktivieren fuer Updates
  - platform: template
    name: "OTA Modus"
    id: ota_mode
    icon: "mdi:cloud-upload"
    optimistic: true
    turn_on_action:
      - deep_sleep.prevent: deep_sleep_control
      - logger.log: "Deep-Sleep deaktiviert fuer OTA-Update"
    turn_off_action:
      - deep_sleep.allow: deep_sleep_control
      - logger.log: "Deep-Sleep wieder aktiviert"

text_sensor:
  # Ladeempfehlung als Klartext
  - platform: template
    name: "Ladeempfehlung"
    icon: "mdi:car-electric-outline"
    lambda: |-
      float available = id(available_ev_power).state;
      float amps = id(ev_charge_amps).state;
      if (isnan(available)) return {"Keine Daten"};
      if (available < 500)  return {"Nicht laden - kaum Solarstrom"};
      if (amps < 6.0)       return {"Zu wenig fuer Wallbox (< 6A / 1.4 kW)"};
      if (amps < 10.0) {
        char buf[64];
        snprintf(buf, sizeof(buf), "Laden moeglich: %.0fA / %.1f kW", amps, amps * 0.23);
        return {buf};
      }
      if (amps >= 10.0) {
        char buf[64];
        snprintf(buf, sizeof(buf), "Gute Sonne! Laden mit %.0fA / %.1f kW", amps, amps * 0.23);
        return {buf};
      }
      return {"Unbekannt"};
    update_interval: 5s

  # Einstrahlungs-Kategorie
  - platform: template
    name: "Einstrahlungs-Kategorie"
    icon: "mdi:weather-partly-cloudy"
    lambda: |-
      float irr = id(solar_irradiance_wm2).state;
      if (isnan(irr)) return {"Unbekannt"};
      if (irr < 10)   return {"Nacht/Schatten"};
      if (irr < 100)  return {"Bewoelkt"};
      if (irr < 400)  return {"Teilweise bewoelkt"};
      if (irr < 700)  return {"Leicht bewoelkt"};
      return {"Volle Sonne"};
    update_interval: 5s

  # Batterie-Status
  - platform: template
    name: "Batterie Status"
    icon: "mdi:battery"
    lambda: |-
      float pct = id(battery_percent).state;
      if (isnan(pct)) return {"Unbekannt"};
      if (pct < 10) return {"Kritisch! Bald offline"};
      if (pct < 30) return {"Niedrig"};
      if (pct < 70) return {"OK"};
      return {"Voll"};
    update_interval: 5s
