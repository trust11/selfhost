# ESPHome Konfiguration: Autarker Solarstrahlungs-Sensor
# Solarpanel + Supercap - kein Akku, kein Netzanschluss!
#
# Prinzip:
#   Sonne scheint -> Panel liefert Strom + laedt Supercaps -> Sensor laeuft
#   Wolke/Schatten -> Supercaps ueberbruecken ca. 30-60 Min
#   Sonne laenger weg -> Sensor geht in Deep-Sleep, dann aus
#   Das ist gewollt: Wenn keine Sonne, gibt es auch keinen PV-Strom.
#
# Hardware:
#   - ESP32 DevKit (z.B. ESP32-WROOM-32)
#   - BH1750 Lux-Sensor (I2C, Adresse 0x23)
#   - Mini-Solarpanel 5V/6V (1-2W)
#   - 2x Supercap 25F 2.7V in Reihe (= ~12.5F bei 5.4V)
#     ODER 1x Supercap-Modul 10F 5.5V (fertig balanciert)
#
# Verkabelung:
#
#   Solarpanel (+) ──> Schottky-Diode ──┬──> ESP32 VIN (oder 5V)
#   Solarpanel (-) ──────────────────┬──┴──> ESP32 GND
#                                    │
#            Supercap (+) ───────────┤ (nach der Diode)
#            Supercap (-) ───────────┘ (an GND)
#
#   Die Schottky-Diode (z.B. 1N5817) verhindert, dass Strom
#   aus den Supercaps zurueck ins Panel fliesst.
#
#   ESP32 GPIO21 (SDA) -> BH1750 SDA
#   ESP32 GPIO22 (SCL) -> BH1750 SCL
#   ESP32 3.3V          -> BH1750 VCC
#   ESP32 GND           -> BH1750 GND
#
# Supercap-Spannung messen (empfohlen):
#   ESP32 VIN ──> 100kOhm ──┬──> ESP32 GPIO35
#                            100kOhm
#                            │
#   GND ─────────────────────┘
#
# Montage:
#   - Solarpanel und Sensor gleiche Ausrichtung wie Dach-PV-Module
#   - IP65 Gehaeuse, Sensor-Fenster nach oben
#   - Ueberall wo WiFi reicht und Sonne hinkommt

esphome:
  name: solar-radiation-sensor
  friendly_name: "Solarstrahlungs-Sensor"

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "Solar-Sensor-Fallback"
    password: !secret fallback_password

captive_portal:

logger:
  level: WARN

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ============================================================
# Deep-Sleep: Strom sparen wenn Supercaps sich leeren
# ============================================================
# Wenn die Sonne laenger weg ist, geht der ESP32 in Deep-Sleep
# (nur ~10uA statt ~150mA). So halten die Supercaps viel laenger.
# Bei Sonne bleibt er wach (Deep-Sleep wird verhindert).
deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 5min

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  # ============================================================
  # Supercap-Spannung ueberwachen
  # ============================================================
  # Spannungsteiler: 2x 100kOhm zwischen VIN und GND, Mitte an GPIO35
  - platform: adc
    pin: GPIO35
    name: "Supercap Spannung"
    id: supercap_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 30s
    attenuation: 11db
    filters:
      - multiply: 2.0  # Spannungsteiler kompensieren

  # BH1750 Lux-Sensor
  - platform: bh1750
    name: "Sonneneinstrahlung Lux"
    address: 0x23
    update_interval: 30s
    id: solar_lux
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2

  # Umrechnung Lux -> W/m²
  # 1 W/m² entspricht ca. 120 Lux bei Sonnenlicht-Spektrum
  - platform: template
    name: "Sonneneinstrahlung"
    id: solar_irradiance_wm2
    unit_of_measurement: "W/m²"
    accuracy_decimals: 1
    icon: "mdi:white-balance-sunny"
    lambda: |-
      float lux = id(solar_lux).state;
      if (isnan(lux)) return NAN;
      return lux / 120.0;
    update_interval: 30s

  # ============================================================
  # Geschaetzte PV-Leistung der Dachanlage
  # ============================================================
  # ANPASSEN AN DEINE DACHANLAGE:
  #   - Zaehle die Module auf dem Dach: 1 Modul = 0.3-0.4 kWp
  #   - Oder frag den Vermieter/Eigentuemer nach der Anlagengroesse
  - platform: template
    name: "Geschaetzte PV-Leistung"
    id: estimated_pv_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    icon: "mdi:solar-power"
    lambda: |-
      float irradiance = id(solar_irradiance_wm2).state;
      if (isnan(irradiance)) return NAN;

      // =============================================
      // ANPASSEN:
      // =============================================
      float peak_power_wp = 10000.0;  // Nennleistung in Wp (10 kWp = 10000)
      float system_losses = 0.80;     // Verluste (Wechselrichter, Kabel, Temp.)

      float power = (irradiance / 1000.0) * peak_power_wp * system_losses;
      return power;
    update_interval: 30s

  # ============================================================
  # EV-Laden: Verfuegbare Leistung fuer Wallbox
  # ============================================================
  - platform: template
    name: "Verfuegbar fuer EV-Ladung"
    id: available_ev_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    icon: "mdi:ev-station"
    lambda: |-
      float pv_power = id(estimated_pv_power).state;
      if (isnan(pv_power)) return 0.0;

      // Grundlast Haushalt abziehen
      float household_base_load = 400.0;

      float available = pv_power - household_base_load;
      if (available < 0) return 0.0;
      return available;
    update_interval: 30s

  # Wie viele Ampere kann die Wallbox ziehen?
  - platform: template
    name: "EV Lade-Ampere moeglich"
    id: ev_charge_amps
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: "mdi:current-ac"
    lambda: |-
      float available = id(available_ev_power).state;
      if (isnan(available) || available < 1380) return 0.0;

      // ANPASSEN: Fuer 3-phasig aendern zu: available / 690.0
      float amps = available / 230.0;  // 1-phasig

      if (amps < 6.0) return 0.0;
      if (amps > 16.0) return 16.0;
      return amps;
    update_interval: 30s

  # WiFi Signalstaerke
  - platform: wifi_signal
    name: "Sensor WiFi Signal"
    update_interval: 60s

  # Supercap Ladestand in Prozent
  - platform: template
    name: "Supercap Ladestand"
    id: supercap_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:flash"
    lambda: |-
      float v = id(supercap_voltage).state;
      if (isnan(v)) return NAN;
      // Supercap: 5.0V = voll, 3.3V = ESP32 Minimum
      float pct = (v - 3.3) / (5.0 - 3.3) * 100.0;
      if (pct > 100.0) return 100.0;
      if (pct < 0.0) return 0.0;
      return pct;
    update_interval: 30s

binary_sensor:
  # Kann das Auto jetzt geladen werden?
  - platform: template
    name: "EV Laden moeglich"
    id: ev_charging_possible
    icon: "mdi:car-electric"
    lambda: |-
      float amps = id(ev_charge_amps).state;
      return !isnan(amps) && amps >= 6.0;

  # Scheint die Sonne gerade?
  - platform: template
    name: "Sonne aktiv"
    id: sun_active
    icon: "mdi:weather-sunny"
    lambda: |-
      float irradiance = id(solar_irradiance_wm2).state;
      if (isnan(irradiance)) return false;
      return irradiance > 50.0;

switch:
  # OTA-Modus: Deep-Sleep deaktivieren fuer Updates
  - platform: template
    name: "OTA Modus"
    id: ota_mode
    icon: "mdi:cloud-upload"
    optimistic: true
    turn_on_action:
      - deep_sleep.prevent: deep_sleep_control
    turn_off_action:
      - deep_sleep.allow: deep_sleep_control

# Smarte Deep-Sleep Steuerung:
# Bei Sonne -> wach bleiben (Deep-Sleep verhindern)
# Ohne Sonne -> Deep-Sleep erlauben, Supercaps halten laenger
interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              float irr = id(solar_irradiance_wm2).state;
              return !isnan(irr) && irr > 30.0;
          then:
            - deep_sleep.prevent: deep_sleep_control
          else:
            - if:
                condition:
                  switch.is_off: ota_mode
                then:
                  - deep_sleep.allow: deep_sleep_control

text_sensor:
  # Ladeempfehlung als Klartext
  - platform: template
    name: "Ladeempfehlung"
    icon: "mdi:car-electric-outline"
    lambda: |-
      float available = id(available_ev_power).state;
      float amps = id(ev_charge_amps).state;
      if (isnan(available)) return {"Keine Daten"};
      if (available < 500)  return {"Nicht laden - kaum Solarstrom"};
      if (amps < 6.0)       return {"Zu wenig fuer Wallbox (< 6A / 1.4 kW)"};
      if (amps < 10.0) {
        char buf[64];
        snprintf(buf, sizeof(buf), "Laden moeglich: %.0fA / %.1f kW", amps, amps * 0.23);
        return {buf};
      }
      if (amps >= 10.0) {
        char buf[64];
        snprintf(buf, sizeof(buf), "Gute Sonne! Laden mit %.0fA / %.1f kW", amps, amps * 0.23);
        return {buf};
      }
      return {"Unbekannt"};
    update_interval: 30s

  # Einstrahlungs-Kategorie
  - platform: template
    name: "Einstrahlungs-Kategorie"
    icon: "mdi:weather-partly-cloudy"
    lambda: |-
      float irr = id(solar_irradiance_wm2).state;
      if (isnan(irr)) return {"Unbekannt"};
      if (irr < 10)   return {"Nacht/Schatten"};
      if (irr < 100)  return {"Bewoelkt"};
      if (irr < 400)  return {"Teilweise bewoelkt"};
      if (irr < 700)  return {"Leicht bewoelkt"};
      return {"Volle Sonne"};
    update_interval: 30s
